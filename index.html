<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Tin học — Đề 1</title>
<style>
:root{
--site-primary:#4f46e5;--site-secondary:#0f172a;--site-background:#f5f7fb;
--site-on-primary:#ffffff;--site-on-secondary:#ffffff;--site-on-background:#111827;
--site-font-body:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
--site-font-heading:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;
}
*{box-sizing:border-box} body{margin:0;font-family:var(--site-font-body);background:var(--site-background);color:var(--site-on-background)}
#app{min-height:100vh;background-color:var(--site-background);padding:calc(28px * var(--site-spacing-scale))}
.shell{max-width:850px;margin:auto}
header{background:var(--site-secondary);color:#fff;border-radius:calc(22px * var(--site-radius-scale));padding:28px;margin-bottom:18px}
h1{margin:0 0 7px;font-size:calc(30px * var(--site-heading-scale))} header p{margin:0;opacity:.8}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:calc(18px * var(--site-radius-scale));padding:22px;margin-bottom:16px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 20px} .bar{height:100%;background:var(--site-primary);width:0;transition:.25s}
.meta{display:flex;justify-content:space-between;color:#64748b;font-size:14px}
.question{font-size:19px;font-weight:700;line-height:1.5;margin:18px 0}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dbe1ea;padding:14px 15px;border-radius:12px;margin:10px 0;cursor:pointer;font:inherit;transition:.15s}
.option:hover{border-color:var(--site-primary);transform:translateY(-1px)} .option.selected{border-color:var(--site-primary);background:#eef2ff}
.option.correct{border-color:#16a34a;background:#f0fdf4} .option.wrong{border-color:#dc2626;background:#fef2f2}
.letter{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#eef2ff;color:#3730a3;font-weight:700;margin-right:10px}
.tfgrid{display:grid;gap:10px} .tfrow{border:1px solid #e2e8f0;border-radius:12px;padding:13px}
.tftext{line-height:1.45;margin-bottom:10px} .tfbuttons{display:flex;gap:8px} .tfbuttons button{flex:1;padding:9px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:600}
.tfbuttons button.sel{background:#eef2ff;border-color:var(--site-primary);color:#3730a3} .tfbuttons button.ok{background:#f0fdf4;border-color:#16a34a} .tfbuttons button.bad{background:#fef2f2;border-color:#dc2626}
.actions{display:flex;gap:10px;margin-top:20px} button.primary,button.secondary{border:0;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer} button.primary{background:var(--site-primary);color:#fff} button.secondary{background:#e2e8f0;color:#0f172a}
.result{text-align:center;padding:28px} .score{font-size:48px;font-weight:800;color:var(--site-primary);margin:8px} .hidden{display:none}
.small{font-size:13px;color:#64748b}.nickname{display:flex;gap:10px;margin-top:16px}.nickname input{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.rank{margin-top:18px;text-align:left}.rank table{width:100%;border-collapse:collapse}.rank th,.rank td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left}.rank th:last-child,.rank td:last-child{text-align:right}
@media (max-width:600px){
body{font-size:15px}#app{padding:12px}.shell{width:100%}header{padding:20px 16px;border-radius:16px;margin-bottom:12px}h1{font-size:24px}header p{font-size:13px}.panel{padding:16px;border-radius:14px;margin-bottom:12px}.question{font-size:17px;line-height:1.45;margin:16px 0}.option{padding:13px 12px;margin:8px 0;min-height:50px}.letter{width:28px;height:28px;margin-right:8px}.actions{gap:8px;margin-top:16px;position:sticky;bottom:8px;background:#fff;padding-top:8px}.actions button{flex:1;min-height:46px;font-size:15px}.tfbuttons button{min-height:46px}.result{padding:22px 16px}.score{font-size:42px}.progress{margin:10px 0 16px}.meta{font-size:12px}}
</style></head>
<body><main id="app"><div class="shell">
<header><h1>🧠 Quiz Tin học — Đề 1</h1><p>Trắc nghiệm nhiều lựa chọn + Đúng/Sai • Tự chấm điểm • 🏆 Xếp hạng</p></header>
<div id="start" class="panel" style="text-align:center"><h2>Nhập nickname để chơi</h2><p class="small">Tạo nickname trước khi bắt đầu làm bài.</p><div class="nickname"><input id="nickname" maxlength="20" placeholder="Ví dụ: Quý123"><button class="primary" onclick="startQuiz()">Bắt đầu</button></div></div>
<div id="quiz" class="hidden"></div>
<div id="result" class="panel result hidden"></div>
</div></main>
<script>
const DATA={"mcq": [["Phát biểu nào sau đây về Internet là chính xác nhất?", ["Là mạng máy tính toàn cầu sử dụng bộ giao thức truyền thông TCP/IP.", "Là mạng máy tính khổng lồ.", "Là mạng có hàng triệu máy chủ.", "Là mạng máy tính có hàng triệu máy tính kết nối với nhau."], 0], ["Cách lưu trữ nào sau đây gọi là lưu trữ điện toán đám mây?", ["Lưu vào ổ đĩa D trên máy tính.", "Lưu vào thẻ nhớ.", "Lưu vào đĩa CD.", "Lưu vào Google Drive."], 3], ["Biện pháp nào sau đây dùng để bảo vệ thông tin cá nhân?", ["Để cho máy tính nhiễm phần mềm gián điệp.", "Không ghi chép thông tin cá nhân ở những nơi mà người khác có thể đọc.", "Sử dụng mạng wifi công cộng.", "Đưa thông tin cá nhân lên mạng xã hội."], 1], ["Phát biểu nào sau đây là sai?", ["Trojan là phần mềm nội gián.", "Virus là phần mềm có lợi cho người dùng.", "Virus và worm là phần mềm độc hại.", "Phần mềm độc hại là phần mềm bất lợi cho người dùng."], 1], ["Phát biểu nào sau đây là đúng?", ["Mạng LAN là mạng Internet.", "Mạng LAN là mạng toàn cầu.", "Mạng LAN là mạng cục bộ.", "Mạng LAN là mạng diện rộng."], 2], ["Máy tìm kiếm trên internet dùng với mục đích gì?", ["Tìm kiếm thông tin trên internet.", "Truy cập vào máy chủ.", "Đọc thư điện tử.", "Truy cập vào một website."], 0], ["Các thiết bị sau đây, thiết bị nào không phải là thiết bị mạng?", ["Hub.", "Vỉ mạng.", "Dây mạng.", "Bàn phím."], 3], ["Phần mềm nào sau đây không phải là phần mềm độc hại?", ["Worm.", "Trojan.", "Microsoft Word.", "Virus."], 2], ["Để tự bảo vệ mình trên mạng, ta cần:", ["Chỉ truy cập các trang web tin cậy.", "Kết bạn với những người không quen biết.", "Để lộ thông tin cá nhân.", "Truy cập vào các trang web độc hại."], 0]], "tf": [["An cho rằng Google Dịch chỉ có thể dịch văn bản, không thể dịch tài liệu.", [["Google Dịch có thể dịch cả văn bản và tài liệu.", true], ["Google Dịch chỉ có thể dịch văn bản.", false], ["An có thể sử dụng Google Dịch để dịch một bài báo khoa học từ tiếng Anh sang tiếng Việt.", true], ["Google Dịch hỗ trợ dịch tài liệu ở nhiều định dạng khác nhau, bao gồm cả Microsoft Word, Excel và PowerPoint.", true]]], ["An cho rằng việc gửi bài tập cho Bình qua email là vi phạm bản quyền.", [["Việc chia sẻ bài tập với bạn bè không phải là vi phạm bản quyền.", true], ["Bản quyền chỉ bảo vệ các tác phẩm văn học, nghệ thuật, khoa học.", false], ["Gửi bài tập cho bạn bè qua email là vi phạm bản quyền.", false], ["An có thể chia sẻ bài tập của mình cho Bình miễn là không sử dụng nó cho mục đích thương mại.", true]]]]};
let items=[], idx=0, answers={}, score=0, submitted=false, nickname="";
const letters=["A","B","C","D"];
let leaderboard=JSON.parse(localStorage.getItem("quizLeaderboard")||"[]");
function startQuiz(){nickname=document.getElementById("nickname").value.trim()||"Người chơi";document.getElementById("start").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");render()}
function saveLeaderboard(){leaderboard.push({name:nickname,score,percent:Math.round(score/items.length*100)});leaderboard.sort((a,b)=>b.score-a.score||b.percent-a.percent);leaderboard=leaderboard.slice(0,10);localStorage.setItem("quizLeaderboard",JSON.stringify(leaderboard))}
function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function renderLeaderboard(targetId="leaderboard"){const target=document.getElementById(targetId);if(!target)return;let html="<h3>🏆 Bảng xếp hạng</h3>";if(leaderboard.length){html+="<table><tr><th>#</th><th>Nickname</th><th>Điểm</th></tr>";leaderboard.forEach((p,i)=>{html+="<tr><td>"+(i+1)+"</td><td>"+escapeHtml(p.name)+"</td><td>"+p.score+"/"+items.length+"</td></tr>"});html+="</table>"}else{html+='<p class="small">Chưa có người chơi.</p>'}target.innerHTML=html}
function build(){
 items=[...DATA.mcq.map((q,i)=>({type:"mcq",id:"m"+i,q:q[0],opts:q[1],correct:q[2]})),
 ...DATA.tf.flatMap((q,i)=>q[1].map((s,j)=>({type:"tf",id:"t"+i+"_"+j,q:q[0],statement:s[0],correct:s[1],group:i+1})))];
 render();
}
function render(){
 const el=document.getElementById("quiz"); const total=items.length;
 if(idx>=total) return finish();
 const it=items[idx], pct=Math.round(idx/total*100);
 let body="";
 if(it.type==="mcq") body=it.opts.map((o,i)=>`<button class="option ${answers[it.id]!==undefined?(i===it.correct?"correct":answers[it.id]===i?"wrong":""):answers[it.id]===i?"selected":""}" onclick="pick('${it.id}',${i})"><span class="letter">${letters[i]}</span>${o}${answers[it.id]!==undefined&&i===it.correct?" ✅":""}</button>`).join("");
 else body=`<div class="tfgrid"><div class="small">Nhận định của câu ${it.group}:</div><div class="tfrow"><div class="tftext">${it.statement}</div><div class="tfbuttons"><button class="${answers[it.id]!==undefined?(it.correct===true?"ok":answers[it.id]===true?"bad":""):answers[it.id]===true?"sel":""}" onclick="pick('${it.id}',true)">Đúng${answers[it.id]!==undefined&&it.correct===true?" ✅":""}</button><button class="${answers[it.id]!==undefined?(it.correct===false?"ok":answers[it.id]===false?"bad":""):answers[it.id]===false?"sel":""}" onclick="pick('${it.id}',false)">Sai${answers[it.id]!==undefined&&it.correct===false?" ✅":""}</button></div></div></div>`;
 el.innerHTML=`<section class="panel"><div class="meta"><span>Câu ${idx+1} / ${total}</span><span>${it.type==="mcq"?"Chọn 1 đáp án":"Đúng / Sai"}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="question">${it.type==="mcq"?it.q:it.q}</div>${body}<div class="actions"><button class="secondary" onclick="prev()" ${idx===0?"disabled":""}>← Trước</button><button class="primary" onclick="next()">${idx===total-1?"Nộp bài":"Tiếp →"}</button></div></section>`;
}
function pick(id,val){answers[id]=val;render()}
function prev(){if(idx>0){idx--;render()}}
function next(){idx++;render()}
function finish(){
 score=0; items.forEach(it=>{if(answers[it.id]===it.correct)score++});
 saveLeaderboard();
 const total=items.length, pct=Math.round(score/total*100), points=score;
 document.getElementById("quiz").innerHTML="";
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("result").innerHTML=`<div class="small">HOÀN THÀNH ĐỀ 1 • ${nickname}</div><div class="score">${points} điểm</div><h2>${pct>=80?"Xuất sắc 🎉":pct>=50?"Khá tốt 👍":"Cần ôn lại 📚"}</h2><p>Đúng ${score}/${total} câu • ${pct}%</p><p class="small">Mỗi câu đúng = 1 điểm.</p><div class="actions" style="justify-content:center"><button class="primary" onclick="location.reload()">Chơi lại</button><button class="secondary" onclick="showAnswers()">Xem đáp án</button></div><div class="rank" id="finalLeaderboard"></div>`;
 renderLeaderboard("finalLeaderboard");
}
function showAnswers(){
 idx=0; const el=document.getElementById("quiz"); document.getElementById("result").classList.add("hidden");
 el.innerHTML=`<section class="panel"><h2>Đáp án chi tiết</h2>${items.map((it,i)=>`<p><b>Câu ${i+1}:</b> ${it.type==="mcq"?letters[it.correct]:it.correct?"Đúng":"Sai"} — ${it.type==="mcq"?it.q:it.statement}</p>`).join("")}</section>`;
}
build();
</script></body></html>
